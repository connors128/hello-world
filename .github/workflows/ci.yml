name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_release:
    name: Build (Release, GCC)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -S . -B build_release
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build_release --config Release

  test_release:
    name: Test (Release)
    runs-on: ubuntu-latest
    needs: build_release

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -S . -B build_release
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build_release --config Release

      - name: Test
        run: ctest --test-dir build_release --output-on-failure

  coverage:
    name: Coverage (gcov)
    runs-on: ubuntu-latest
    needs: test_release

    steps:
      - uses: actions/checkout@v6

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr

      - name: Configure (coverage)
        run: >
          cmake -S . -B build_coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build_coverage

      - name: Test
        run: ctest --test-dir build_coverage --output-on-failure

      - name: Generate coverage report
        run: |
          gcovr \
            --root . \
            --filter src \
            --sonarqube coverage.xml \
            build_coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v6
        with:
          name: coverage-artifacts
          path: |
            coverage.xml
            build_coverage/compile_commands.json

  build_sanitizers:
    name: Build (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    needs: test_release

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan, tsan]

    steps:
      - uses: actions/checkout@v6

      - name: Configure (${{ matrix.sanitizer }})
        run: >
          cmake -S . -B build_${{ matrix.sanitizer }}
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DSANITIZER=${{ matrix.sanitizer }}

      - name: Build (${{ matrix.sanitizer }})
        run: cmake --build build_${{ matrix.sanitizer }}

  test_sanitizers:
    name: Test (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    needs: build_sanitizers

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan, tsan]

    steps:
      - uses: actions/checkout@v6

      - name: Configure (${{ matrix.sanitizer }})
        run: >
          cmake -S . -B build_${{ matrix.sanitizer }}
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DSANITIZER=${{ matrix.sanitizer }}

      - name: Build (${{ matrix.sanitizer }})
        run: cmake --build build_${{ matrix.sanitizer }}

      - name: Test (${{ matrix.sanitizer }})
        run: ctest --test-dir build_${{ matrix.sanitizer }} --output-on-failure

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: coverage

    steps:
      - uses: actions/checkout@v6

      - name: Download coverage artifacts
        uses: actions/download-artifact@v6
        with:
          name: coverage-artifacts

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=connors128_hello-world
            -Dsonar.organization=connors128
            -Dsonar.cfamily.compile-commands=build_coverage/compile_commands.json
            -Dsonar.coverageReportPaths=coverage.xml
